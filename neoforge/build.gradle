apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'architectury-plugin'
apply plugin: 'dev.architectury.loom'
apply plugin: 'com.gradleup.shadow'

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

sourceSets.main.resources {
    srcDir project(':common').file('src/main/resources')
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"
    modImplementation "dev.isxander:yet-another-config-lib:${rootProject.yacl_version}-neoforge"
    compileOnly "maven.modrinth:DistantHorizonsApi:${rootProject.distant_horizons_api_version}"

    common(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) {
        transitive = false
    }

    // Architectury Loom strips YACL's Jar-in-Jar metadata while remapping it.
    // Re-declare the small runtime libraries so NeoForge exposes them to YACL's module.
    include "org.quiltmc.parsers:json:0.2.1"
    include "org.quiltmc.parsers:gson:0.2.1"
    include "org.jetbrains:annotations:24.0.1"
    forgeRuntimeLibrary "org.quiltmc.parsers:json:0.2.1"
    forgeRuntimeLibrary "org.quiltmc.parsers:gson:0.2.1"
    forgeRuntimeLibrary "org.jetbrains:annotations:24.0.1"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var replaceProperties = [
            minecraft_version      : rootProject.minecraft_version,
            minecraft_version_range: rootProject.minecraft_version_range,
            neo_version            : rootProject.neo_version,
            loader_version_range   : rootProject.loader_version_range,
            mod_id                 : rootProject.mod_id,
            mod_name               : rootProject.mod_name,
            mod_license            : rootProject.mod_license,
            mod_version            : rootProject.mod_version,
            mod_authors            : rootProject.mod_authors,
            mod_description        : rootProject.mod_description,
            mod_display_url        : rootProject.mod_display_url,
            mod_issue_tracker      : rootProject.mod_issue_tracker,
            architectury_version   : rootProject.architectury_version,
            yacl_version           : rootProject.yacl_version,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.named('shadowJar').configure {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shadowCommon]
    exclude 'fabric.mod.json'
}

tasks.named('remapJar').configure {
    inputFile = tasks.named('shadowJar').flatMap { it.archiveFile }
    dependsOn tasks.named('shadowJar')
}

tasks.named('sourcesJar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':common').tasks.named('sourcesJar', Jar)
    dependsOn commonSources
    from commonSources.map { zipTree(it.archiveFile.get().asFile) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
