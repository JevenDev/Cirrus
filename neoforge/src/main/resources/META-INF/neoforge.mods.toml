modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="${mod_issue_tracker}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="logo.png"
authors="${mod_authors}"
displayURL="${mod_display_url}"
description='''
${mod_description}
'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="cirrus.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="yet_another_config_lib_v3"
type="required"
versionRange="[3.8.1,)"
ordering="AFTER"
side="CLIENT"
