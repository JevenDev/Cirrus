plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19' apply false
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

allprojects {
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        mavenCentral()
        maven {
            name = 'Xander Maven'
            url = 'https://maven.isxander.dev/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'TerraformersMC'
            url = 'https://maven.terraformersmc.com/releases/'
        }
        exclusiveContent {
            forRepository {
                maven { url = 'https://api.modrinth.com/maven' }
            }
            filter { includeGroup 'maven.modrinth' }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'

    base {
        archivesName = "${rootProject.archives_base_name}-${project.name}-${rootProject.minecraft_version_label}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version.toInteger())
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = rootProject.java_version.toInteger()
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                from components.java
            }
        }
        repositories {
            maven {
                url = rootProject.file('repo').toURI()
            }
        }
    }
}
